<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PULSE LIVE - Multi-Playlist Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --card: #121212; --text: #f0f0f0;
            --accent: #bc13fe; --accent-glow: rgba(188, 19, 254, 0.5);
            --dot-base: #222;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
        button { touch-action: manipulation; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 12px 0; }

        .container {
            width: 94%; max-width: 380px; background: var(--card); padding: 25px;
            border-radius: 40px; text-align: center; border: 1px solid #222;
            box-shadow: 0 30px 100px rgba(0,0,0,1); position: relative; height: 750px; height: min(750px, calc(100dvh - 24px)); min-height: 600px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        h1 { color: var(--accent); font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin: 0; text-shadow: 0 0 10px var(--accent-glow); }
        .lab-toggle { background: #1a1a1a; border: 1px solid #333; color: var(--accent); padding: 8px 15px; border-radius: 12px; font-family: 'Orbitron'; font-size: 0.6rem; cursor: pointer; }

        .beat-counter { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 10px 0; min-height: 40px; flex-grow: 0; }
        .beat-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--dot-base); transition: 0.1s; border: 2px solid #333; }
        .beat-dot.active { background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); transform: scale(1.2); border-color: #fff; }

        .live-display { 
            background: #000; width: 100%; border-radius: 35px; border: 2px solid #1a1a1a; 
            padding: 20px; transition: 0.07s ease-out; display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 5px 0; position: relative; overflow: hidden; flex-grow: 1; min-height: 0;
        }
        #song-title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #aaa; margin-bottom: 5px; text-transform: uppercase; z-index: 2; letter-spacing: 1px; }
        #bpm-val { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(4.5rem, 24vw, 7.5rem); line-height: 0.9; color: var(--accent); z-index: 2; }
        #time-sig-display { font-family: 'Orbitron'; font-size: 1.1rem; color: #555; margin-top: 10px; letter-spacing: 4px; z-index: 2; }
        .next-label { font-family: 'Orbitron'; font-size: 0.75rem; color: #444; margin-top: 15px; letter-spacing: 1.5px; z-index: 2; }

        .live-display.flash-full { background: var(--accent); border-color: #fff; }
        .live-display.flash-full * { color: #000 !important; }
        .live-display::before, .live-display::after {
            content: ''; position: absolute; top: 0; width: 14px; height: 100%;
            background: var(--accent); opacity: 0; transition: 0.07s; border-radius: 35px;
        }
        .live-display::before { left: -2px; } .live-display::after { right: -2px; }
        .live-display.flash-side::before, .live-display.flash-side::after { opacity: 1; }

        .controls-row { display: flex; gap: 10px; height: 75px; margin: 15px 0 10px 0; }
        .nav-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; color: var(--accent); border-radius: 18px; font-family: 'Orbitron'; font-size: 0.6rem; cursor: pointer; }
        .play-btn { flex: 1.8; background: var(--accent); border: none; color: black; border-radius: 18px; font-family: 'Orbitron'; font-weight: 900; font-size: 1.1rem; cursor: pointer; }
        .play-btn.stop { background: #000 !important; color: var(--accent) !important; border: 2px solid var(--accent); }

        .color-palette { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; padding-bottom: 5px; }
        .color-box { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-box.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* LAB PANEL */
        #lab-panel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--card); border-radius: 40px; padding: 20px;
            display: none; flex-direction: column; z-index: 100;
        }
        #lab-panel.active { display: flex; }
        .lab-input { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 6px; font-family: 'Inter'; width: 100%; font-size: 0.8rem; }
        .row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
        .playlist-manager { background: #1a1a1a; padding: 10px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .playlist-ctrl { display: flex; gap: 5px; margin-top: 8px; }
        .pl-btn { flex: 1; padding: 8px 5px; font-size: 0.6rem; font-family: 'Orbitron'; cursor: pointer; border-radius: 5px; border: 1px solid #444; background: #222; color: #ccc; }
        #song-list-ui { flex-grow: 1; min-height: 0; overflow-y: auto; text-align: left; margin-top: 10px; padding-right: 5px; }
        .song-item { background: #111; padding: 12px; border-radius: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; border: 1px solid #222; }
        .edit-btn { color: var(--accent); background: none; border: 1px solid var(--accent); padding: 4px 8px; border-radius: 5px; font-size: 0.55rem; font-family: 'Orbitron'; cursor: pointer; }
        .song-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
        .song-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .song-actions .edit-btn { min-width: 28px; padding: 6px 7px; }
        .edit-btn:disabled { opacity: 0.25; }
        .del-btn { color: #f04; border-color: #f04; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="current-playlist-name">PULSE</h1>
        <button class="lab-toggle" onclick="toggleLab()">LAB</button>
    </div>

    <div class="beat-counter" id="beat-counter"></div>

    <div class="live-display" id="main-display">
        <div id="song-title">SELECT LIST</div>
        <div id="bpm-val">--</div>
        <div id="time-sig-display">--</div>
        <div class="next-label">NEXT: <span id="next-song" style="color:#666">--</span></div>
    </div>

    <div class="controls-row">
        <button class="nav-btn" onclick="prevSong()">PREV</button>
        <button id="play-stop" class="play-btn" onclick="togglePlay()">ENGAGE</button>
        <button class="nav-btn" onclick="nextSong()">NEXT</button>
    </div>

    <div class="color-palette" id="color-palette"></div>

    <div id="lab-panel">
        <div style="display:flex; justify-content:space-between; font-family:Orbitron; color:var(--accent); margin-bottom:10px;">
            <span>MANAGER</span>
            <button onclick="toggleLab()" style="background:none; border:none; color:#fff; cursor:pointer;">CLOSE</button>
        </div>
        <div class="playlist-manager">
            <select id="pl-select" aria-label="Playlist" class="lab-input" style="margin:0;" onchange="switchPlaylist(this.value)"></select>
            <div class="playlist-ctrl">
                <button class="pl-btn" onclick="createNewPlaylist()">NEW LIST</button>
                <button class="pl-btn" style="color:#f04" onclick="deleteCurrentPlaylist()">DELETE LIST</button>
            </div>
        </div>
        <input type="text" id="new-title" class="lab-input" placeholder="TITOLO BRANO" aria-label="Titolo brano" maxlength="40">
        <div class="row">
            <input type="number" id="new-bpm" class="lab-input" placeholder="BPM" aria-label="BPM" min="20" max="300" inputmode="numeric" style="margin:0; flex:2;">
            <button class="pl-btn" style="height:35px;" onclick="handleTap()">TAP</button>
        </div>
        <div class="row">
            <input type="number" id="new-num" class="lab-input" value="4" aria-label="Battiti per battuta" min="1" max="16" inputmode="numeric" style="margin:0; text-align:center;">
            <span style="font-family:Orbitron; color:#444;">/</span>
            <select id="new-den" aria-label="Valore della battuta" class="lab-input" style="margin:0;">
                <option value="4">4</option>
                <option value="8">8</option>
                <option value="16">16</option>
            </select>
        </div>
        <button id="save-btn" onclick="addSong()" style="width:100%; padding:12px; background:var(--accent); border:none; border-radius:10px; font-family:Orbitron; font-weight:900; cursor:pointer;">SALVA BRANO</button>
        <div id="song-list-ui"></div>
        <div class="playlist-ctrl" style="margin-top:8px;">
            <button class="pl-btn" onclick="exportDB()">EXPORT BACKUP</button>
            <button class="pl-btn" onclick="document.getElementById('import-file').click()">IMPORT BACKUP</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden onchange="importDB(event)">
        </div>
    </div>
</div>

<script>
    const MIN_BPM = 20, MAX_BPM = 300, MAX_NUM = 16;
    const $ = id => document.getElementById(id);
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
    const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
    const DEFAULT_DB = () => ({ activeList: "DEFAULT", playlists: { "DEFAULT": [{ title: "START HERE", bpm: 120, num: 4, den: 4 }] }, themeColor: "#bc13fe" });

    // Valida i dati (storage corrotto o file importato) per non mandare in crash l'app
    function sanitizeDB(raw) {
        const d = DEFAULT_DB();
        if (!raw || typeof raw !== 'object' || !raw.playlists || typeof raw.playlists !== 'object') return d;
        const pls = {};
        Object.keys(raw.playlists).forEach(name => {
            if (name === '__proto__' || !Array.isArray(raw.playlists[name])) return;
            pls[name] = raw.playlists[name].filter(s => s && typeof s === 'object').map(s => ({
                title: String(s.title || 'UNTITLED').slice(0, 40),
                bpm: clamp(parseInt(s.bpm) || 120, MIN_BPM, MAX_BPM),
                num: clamp(parseInt(s.num) || 4, 1, MAX_NUM),
                den: [4, 8, 16].includes(parseInt(s.den)) ? parseInt(s.den) : 4
            }));
        });
        const names = Object.keys(pls);
        if (!names.length) return d;
        return {
            activeList: has(pls, raw.activeList) ? raw.activeList : names[0],
            playlists: pls,
            themeColor: /^#[0-9a-f]{6}$/i.test(raw.themeColor) ? raw.themeColor : d.themeColor
        };
    }

    let db;
    try { db = sanitizeDB(JSON.parse(localStorage.getItem('pulse_db'))); } catch (e) { db = DEFAULT_DB(); }

    const colors = [
        { name: 'bianco', hex: '#ffffff' }, { name: 'giallo', hex: '#ffeb3b' },
        { name: 'verde', hex: '#4caf50' }, { name: 'blu', hex: '#2196f3' },
        { name: 'rosso', hex: '#f44336' }, { name: 'viola', hex: '#bc13fe' }
    ];

    let isPlaying = false, audioCtx = null, timerID = null, nextTickTime = 0, currentBeat = 0, currentIndex = 0, editIndex = -1, tapTimes = [];
    let keepAlive = null, wakeLock = null;

    const curList = () => db.playlists[db.activeList] || [];

    function initApp() { renderPlaylistSelect(); renderColorPalette(); setThemeColor(db.themeColor); updateUI(); renderLabList(); }
    function saveDB() { try { localStorage.setItem('pulse_db', JSON.stringify(db)); } catch (e) { /* storage non disponibile */ } }

    function renderColorPalette() {
        const palette = $('color-palette');
        palette.innerHTML = '';
        colors.forEach(color => {
            const box = document.createElement('div');
            box.className = 'color-box';
            box.style.backgroundColor = color.hex;
            box.setAttribute('role', 'button'); box.setAttribute('aria-label', 'Colore ' + color.name); box.tabIndex = 0;
            if (color.hex === db.themeColor) box.classList.add('active');
            box.onclick = () => setThemeColor(color.hex);
            box.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setThemeColor(color.hex); } };
            palette.appendChild(box);
        });
    }

    function setThemeColor(hex) {
        db.themeColor = hex;
        document.documentElement.style.setProperty('--accent', hex);
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        document.documentElement.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.5)`);
        saveDB(); renderColorPalette();
    }

    function updateUI() {
        const list = curList();
        currentIndex = list.length ? clamp(currentIndex, 0, list.length - 1) : 0;
        if (!list.length) {
            $('song-title').innerText = "EMPTY LIST";
            $('bpm-val').innerText = "--";
            $('time-sig-display').innerText = "--";
            $('next-song').innerText = "--";
            $('beat-counter').innerHTML = '';
            return;
        }
        const s = list[currentIndex];
        $('song-title').innerText = s.title;
        $('bpm-val').innerText = s.bpm;
        $('time-sig-display').innerText = `${s.num}/${s.den}`;
        $('next-song').innerText = list[currentIndex + 1] ? list[currentIndex + 1].title : "END";

        const cnt = $('beat-counter'); cnt.innerHTML = '';
        const dots = s.den === 8 ? Math.ceil(s.num / 3) : (s.den === 16 ? Math.ceil(s.num / 4) : s.num);
        for (let i = 0; i < dots; i++) { const d = document.createElement('div'); d.className = 'beat-dot'; d.id = `dot-${i}`; cnt.appendChild(d); }
    }

    // --- LAB ---
    function renderLabList() {
        const ui = $('song-list-ui');
        ui.innerHTML = '';
        const songs = curList();
        songs.forEach((s, i) => {
            const item = document.createElement('div'); item.className = 'song-item';
            const info = document.createElement('div'); info.className = 'song-info';
            info.textContent = s.title + ' ';                       // textContent: niente HTML iniettato dai titoli
            const meta = document.createElement('span'); meta.style.color = 'var(--accent)';
            meta.textContent = `${s.bpm} · ${s.num}/${s.den}`;
            info.appendChild(meta); item.appendChild(info);
            const acts = document.createElement('div'); acts.className = 'song-actions';
            const mk = (label, aria, fn, cls, off) => {
                const b = document.createElement('button');
                b.className = cls; b.textContent = label; b.setAttribute('aria-label', aria + ' ' + s.title);
                b.disabled = !!off; b.onclick = fn; acts.appendChild(b);
            };
            mk('▲', 'Sposta su', () => moveSong(i, -1), 'edit-btn', i === 0);
            mk('▼', 'Sposta giù', () => moveSong(i, 1), 'edit-btn', i === songs.length - 1);
            mk('EDIT', 'Modifica', () => editSong(i), 'edit-btn');
            mk('X', 'Elimina', () => deleteSong(i), 'edit-btn del-btn');
            item.appendChild(acts); ui.appendChild(item);
        });
    }

    function moveSong(i, d) {
        const l = curList(), j = i + d;
        if (j < 0 || j >= l.length) return;
        [l[i], l[j]] = [l[j], l[i]];
        if (currentIndex === i) currentIndex = j; else if (currentIndex === j) currentIndex = i;
        if (editIndex === i) editIndex = j; else if (editIndex === j) editIndex = i;
        saveDB(); renderLabList(); updateUI();
    }

    function addSong() {
        const song = {
            title: ($('new-title').value.trim().toUpperCase() || "UNTITLED").slice(0, 40),
            bpm: clamp(parseInt($('new-bpm').value) || 120, MIN_BPM, MAX_BPM),   // un BPM negativo mandava in loop infinito lo scheduler
            num: clamp(parseInt($('new-num').value) || 4, 1, MAX_NUM),
            den: parseInt($('new-den').value) || 4
        };
        const list = curList();
        if (editIndex > -1 && editIndex < list.length) list[editIndex] = song; else list.push(song);
        saveDB(); resetLab(); renderLabList(); updateUI();
    }

    function editSong(i) {
        editIndex = i;
        const s = curList()[i];
        $('new-title').value = s.title; $('new-bpm').value = s.bpm;
        $('new-num').value = s.num; $('new-den').value = s.den;
        $('save-btn').innerText = "AGGIORNA BRANO";
        $('new-title').focus();
    }

    function deleteSong(i) {
        if (!confirm("Eliminare questo brano?")) return;
        curList().splice(i, 1);
        if (i < currentIndex) currentIndex--; else if (i === currentIndex && isPlaying) stopPlay();
        resetLab(); saveDB(); renderLabList(); updateUI();
    }

    function resetLab() {
        editIndex = -1;
        $('save-btn').innerText = "SALVA BRANO";
        $('new-title').value = ""; $('new-bpm').value = "";
        tapTimes = [];
    }

    function toggleLab() {
        $('lab-panel').classList.toggle('active');
        if ($('lab-panel').classList.contains('active')) renderLabList();
    }

    function renderPlaylistSelect() {
        const sel = $('pl-select'); sel.innerHTML = '';
        Object.keys(db.playlists).forEach(name => {
            const opt = document.createElement('option'); opt.value = name; opt.innerText = name;
            if (name === db.activeList) opt.selected = true; sel.appendChild(opt);
        });
        $('current-playlist-name').innerText = db.activeList;
    }

    function switchPlaylist(name) {
        if (isPlaying) stopPlay();
        db.activeList = name; currentIndex = 0;
        resetLab(); saveDB(); renderPlaylistSelect(); updateUI(); renderLabList();
    }

    function createNewPlaylist() {
        const input = prompt("Nome nuova Playlist:");          // prompt annullato = null: prima mandava in errore
        const name = input ? input.trim().toUpperCase().slice(0, 30) : "";
        if (!name) return;
        if (has(db.playlists, name)) return alert("Esiste già una playlist con questo nome.");
        db.playlists[name] = [];
        switchPlaylist(name);
    }

    function deleteCurrentPlaylist() {
        const keys = Object.keys(db.playlists);
        if (keys.length <= 1) return alert("Impossibile eliminare l'ultima playlist.");
        if (confirm(`Eliminare la playlist ${db.activeList}?`)) {
            delete db.playlists[db.activeList];
            switchPlaylist(Object.keys(db.playlists)[0]);
        }
    }

    function handleTap() {
        const now = performance.now();
        if (tapTimes.length && now - tapTimes[tapTimes.length - 1] > 2000) tapTimes = [];
        tapTimes.push(now); if (tapTimes.length > 6) tapTimes.shift();
        if (tapTimes.length > 1) {
            const avg = (now - tapTimes[0]) / (tapTimes.length - 1);
            $('new-bpm').value = clamp(Math.round(60000 / avg), MIN_BPM, MAX_BPM);
        }
    }

    // --- BACKUP ---
    function exportDB() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
        a.download = 'pulse-live-backup.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function importDB(ev) {
        const file = ev.target.files[0]; ev.target.value = '';
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
            try {
                const data = JSON.parse(r.result);
                if (!data || typeof data.playlists !== 'object') throw new Error('formato');
                if (!confirm("Importare il backup? Sostituirà tutte le playlist attuali.")) return;
                stopPlay(); db = sanitizeDB(data); currentIndex = 0; resetLab(); saveDB(); initApp();
            } catch (e) { alert("File di backup non valido."); }
        };
        r.readAsText(file);
    }

    // --- ENGINE METRONOMO ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Fruscio quasi inudibile: tiene aperto il canale dei ricevitori Bluetooth tra un click e l'altro
    const KEEPALIVE_GAIN = 0.004;
    function startKeepAlive() {
        if (keepAlive) return;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate), ch = buf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource(), g = audioCtx.createGain();
        src.buffer = buf; src.loop = true; g.gain.value = KEEPALIVE_GAIN;
        src.connect(g); g.connect(audioCtx.destination); src.start();
        keepAlive = { src, g };
    }
    function stopKeepAlive() {
        if (!keepAlive) return;
        try { keepAlive.src.stop(); } catch (e) { /* già fermo */ }
        keepAlive.g.disconnect(); keepAlive = null;
    }
    async function setWake(on) {
        try {
            if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        } catch (e) { /* non critico */ }
    }

    function setPlayBtn() { $('play-stop').innerText = isPlaying ? "STOP" : "ENGAGE"; $('play-stop').classList.toggle('stop', isPlaying); }
    function clearBeatVisuals() {
        document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
        $('main-display').classList.remove('flash-full', 'flash-side');
    }

    function startPlay() {
        isPlaying = true; currentBeat = 0;
        startKeepAlive(); setWake(true);
        nextTickTime = audioCtx.currentTime + 0.25;              // tempo al link BT per "svegliarsi"
        setPlayBtn(); scheduler();
    }
    function stopPlay() {
        isPlaying = false; clearTimeout(timerID);
        stopKeepAlive(); setWake(false); clearBeatVisuals(); setPlayBtn();
    }
    function togglePlay() {
        if (!isPlaying && !curList().length) return;             // lista vuota: niente da suonare
        initAudio();
        if (isPlaying) stopPlay(); else startPlay();
    }

    function scheduler() {
        const s = curList()[currentIndex];
        if (!s) { stopPlay(); return; }
        const step = (60 / s.bpm) / (s.den === 8 ? 3 : (s.den === 16 ? 4 : 1));
        while (nextTickTime < audioCtx.currentTime + 0.1) {
            playClick(nextTickTime, currentBeat, s);
            nextTickTime += step;
            currentBeat = (currentBeat + 1) % s.num;
        }
        timerID = setTimeout(scheduler, 25);
    }

    function playClick(t, b, s) {
        const osc = audioCtx.createOscillator(), env = audioCtx.createGain();
        let isAccent = (b === 0);
        if (s.den === 8 && b % 3 === 0) isAccent = true;
        if (s.den === 16 && b % 4 === 0) isAccent = true;
        const freq = (b === 0) ? 1200 : (isAccent ? 800 : 400);
        const vol = (b === 0) ? 0.4 : (isAccent ? 0.2 : 0.05);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        env.gain.setValueAtTime(0.0001, t);
        env.gain.linearRampToValueAtTime(vol, t + 0.003);        // attacco morbido
        env.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        osc.connect(env); env.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.1);
        setTimeout(() => {
            if (!isPlaying) return;
            const d = $('main-display');
            if (isAccent) { d.classList.add(b === 0 ? 'flash-full' : 'flash-side'); setTimeout(() => d.classList.remove('flash-full', 'flash-side'), 60); }
            const vIdx = s.den === 8 ? Math.floor(b / 3) : (s.den === 16 ? Math.floor(b / 4) : b);
            document.querySelectorAll('.beat-dot').forEach(dot => dot.classList.remove('active'));
            const dot = $(`dot-${vIdx}`); if (dot) dot.classList.add('active');
        }, Math.max(0, (t - audioCtx.currentTime) * 1000));
    }

    function nextSong() { if (currentIndex < curList().length - 1) { currentIndex++; if (isPlaying) stopPlay(); updateUI(); } }
    function prevSong() { if (currentIndex > 0) { currentIndex--; if (isPlaying) stopPlay(); updateUI(); } }

    // Tastiera / pedale Bluetooth (spesso inviano frecce o PagSu/PagGiù): Spazio = play, ←/→ = brano
    document.addEventListener('keydown', e => {
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || $('lab-panel').classList.contains('active')) return;
        if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePlay(); }
        else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); nextSong(); }
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevSong(); }
    });
    // Il Wake Lock viene rilasciato quando la pagina va in background: lo richiede di nuovo al ritorno
    document.addEventListener('visibilitychange', () => { if (!document.hidden && isPlaying) setWake(true); });

    initApp();
</script>
</body>
